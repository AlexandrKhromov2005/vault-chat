# NATS JetStream for content-free push signals Chat -> Auth
# (docs/adr/0003-push-signals-jetstream.md). Only the internal events network
# reaches the client port; monitoring listens on the container loopback for
# the healthcheck.
#
# Clients authenticate with the service certificates of the internal CA
# (docs/mtls.md): verify_and_map turns the certificate URI into the user.
# There are no passwords and no anonymous user; other services' certificates
# from the same CA match no user and are refused.

server_name: vault-nats
listen: 0.0.0.0:4222
http: 127.0.0.1:8222

# A signal is at most 24 KiB; anything larger is refused by the server.
max_payload: 32KB
max_connections: 32
max_subscriptions: 64
max_control_line: 4KB
write_deadline: "5s"

jetstream {
  store_dir: /data
  max_memory_store: 16MB
  # The PUSH_SIGNALS stream is limited to 256 MiB; the rest is headroom for
  # consumer state and compaction.
  max_file_store: 512MB
}

tls {
  cert_file: /run/secrets/nats/tls.crt
  key_file: /run/secrets/nats/tls.key
  ca_file: /run/secrets/nats/ca.pem
  min_version: "1.3"
  verify_and_map: true
  timeout: 2
}

authorization {
  timeout: 2
  users: [
    # Chat publishes signals and receives their PubAck on its own inbox.
    # It cannot read the stream, manage it or see Auth's traffic.
    {
      user: "spiffe://vault-chat/service/chat"
      permissions: {
        publish: { allow: ["push.signal.v1"] }
        subscribe: { allow: ["_INBOX_chat.>"] }
      }
    }
    # Auth declares the stream and its durable consumer, pulls from it and
    # acknowledges. It cannot publish signals, delete or purge the stream,
    # or touch other streams and consumers.
    {
      user: "spiffe://vault-chat/service/auth"
      permissions: {
        publish: {
          allow: [
            "$JS.API.STREAM.CREATE.PUSH_SIGNALS"
            "$JS.API.STREAM.UPDATE.PUSH_SIGNALS"
            "$JS.API.STREAM.INFO.PUSH_SIGNALS"
            "$JS.API.CONSUMER.CREATE.PUSH_SIGNALS.auth-push"
            "$JS.API.CONSUMER.CREATE.PUSH_SIGNALS.auth-push.>"
            "$JS.API.CONSUMER.INFO.PUSH_SIGNALS.auth-push"
            "$JS.API.CONSUMER.MSG.NEXT.PUSH_SIGNALS.auth-push"
            "$JS.ACK.PUSH_SIGNALS.auth-push.>"
          ]
        }
        subscribe: { allow: ["_INBOX_auth.>"] }
      }
    }
  ]
}

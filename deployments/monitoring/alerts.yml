groups:
  - name: vault-chat
    rules:
      - alert: ServiceMetricsUnavailable
        expr: up{job=~"auth|chat|media|gateway|calls|node|alertmanager|grafana|blackbox|gateway-ready|storage-ready|data-tcp"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Metrics unavailable for {{ $labels.job }}'}
      - alert: DependencyUnavailable
        expr: probe_success == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Probe failed: {{ $labels.instance }}'}
      - alert: GatewayHighErrorRate
        expr: sum(rate(vault_http_requests_total{kind="api",status=~"5.."}[5m])) / clamp_min(sum(rate(vault_http_requests_total{kind="api"}[5m])), 0.001) > 0.1 and sum(increase(vault_http_requests_total{kind="api"}[5m])) >= 5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'More than 10% API requests fail (at least 5 requests/5m)'}
      - alert: GRPCHighErrorRate
        expr: sum by (service) (rate(vault_grpc_requests_total{code=~"Internal|Unavailable|DeadlineExceeded|DataLoss|Unknown",method!~"/grpc.health.*"}[5m])) / clamp_min(sum by (service) (rate(vault_grpc_requests_total{method!~"/grpc.health.*"}[5m])), 0.001) > 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'RPC errors exceed 10% in {{ $labels.service }}'}
      - alert: RealtimeEventsLost
        expr: increase(vault_events_dropped_total[5m]) + increase(vault_events_publish_failures_total[5m]) + increase(vault_events_encoding_failures_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Realtime events were dropped or could not be published; clients must catch up'}
      - alert: RealtimeQueueNearlyFull
        expr: vault_event_queue_pending / vault_event_queue_capacity > 0.8
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Event queue remains above 80%'}
      - alert: PushSignalsLost
        expr: increase(vault_push_signals_lost_total[10m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Push signals were not stored: the broker or stream is unavailable or full; devices wake on their next sync'}
      - alert: PushSignalsBacklog
        expr: vault_push_stream_pending > 1000
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'More than 1000 push signals wait in the stream; Auth is not keeping up'}
      - alert: PushStreamUnreachable
        expr: vault_push_stream_pending < 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Auth cannot read the push signal stream'}
      - alert: PushSignalsExhausted
        expr: increase(vault_push_signals_exhausted_total[15m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Push signals were terminated after their last delivery failed'}
      - alert: CallsCapacityNearlyFull
        expr: vault_calls_active / vault_calls_capacity > 0.9
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Calls admission is above 90% capacity'}
      - alert: CallsEventQueueNearlyFull
        expr: vault_calls_event_queue / 1024 > 0.8
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Calls Redis event queue remains above 80%'}
      - alert: CallsDependencyFailing
        expr: increase(vault_calls_dependency_requests_total{code=~"unavailable|internal"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Calls Auth/Chat dependency requests are failing'}
      - alert: CallsHighRPCLatency
        expr: histogram_quantile(0.99, sum by (le) (rate(vault_calls_grpc_request_duration_seconds_bucket{method!~"/grpc.health.*"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Calls RPC p99 exceeds 500 ms'}
      - alert: CallsDraining
        expr: vault_calls_draining == 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Calls is draining and rejects new calls'}
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Less than 10% host RAM available'}
      - alert: HostDiskLow
        expr: node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 5m
        labels: {severity: critical}
        annotations: {summary: 'Less than 15% free space on root disk'}
      - alert: HostCPUHigh
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations: {summary: 'Host CPU remains above 90%'}
      - alert: BackupOverdue
        expr: time() - vault_backup_last_success_timestamp_seconds > 93600
        for: 5m
        labels: {severity: critical}
        annotations: {summary: 'No successful local backup for 26 hours'}
      - alert: BackupFailed
        expr: vault_backup_last_attempt_success == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'Latest scheduled backup failed'}
      - alert: OperationsMetricsStale
        expr: time() - vault_operations_collected_timestamp_seconds > 300 or absent(vault_operations_collected_timestamp_seconds)
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Backup/certificate metrics have stopped updating'}
      - alert: CertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 86400
        for: 5m
        labels: {severity: critical}
        annotations: {summary: 'Served TLS certificate expires in less than 24 hours'}
      - alert: CertificateRenewalFailed
        expr: vault_certbot_last_attempt_success == 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Latest automatic certificate renewal check failed'}
      - alert: NotificationDeliveryFailed
        expr: increase(alertmanager_notifications_failed_total[5m]) > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Alertmanager could not deliver one or more notifications'}
      - alert: InternalCertificateExpiring
        expr: vault_rpc_certificate_not_after_timestamp_seconds > 0 and vault_rpc_certificate_not_after_timestamp_seconds - time() < 1209600
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Internal RPC certificate expires in less than 14 days for {{ $labels.service }}'}

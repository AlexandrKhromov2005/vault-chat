modules:
  https_ready:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: [200]
      fail_if_not_ssl: true
      follow_redirects: false
      preferred_ip_protocol: ip4
  http_ready:
    prober: http
    timeout: 5s
    http: {method: GET, valid_status_codes: [200], follow_redirects: false, preferred_ip_protocol: ip4}
  tcp:
    prober: tcp
    timeout: 3s
    tcp: {preferred_ip_protocol: ip4}

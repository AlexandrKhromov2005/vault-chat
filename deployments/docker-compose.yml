name: vault-chat

# Whole MVP stack. Generate the development JWT keys once, then start
# everything from the repository root:
#
#   sh scripts/gen-jwt-keys.sh
#   docker compose -f deployments/docker-compose.yml up -d --build --wait
#
# For development with `go run`, start only the infrastructure:
#
#   docker compose -f deployments/docker-compose.yml up -d postgres chat-postgres redis
#
# Published host ports can be overridden with the *_HOST_PORT variables below
# (for example when 5432 is already taken). Containers always talk to each
# other through service names and container ports, so overrides never affect
# the application configuration.
#
# Every published port is bound to 127.0.0.1: the databases, Redis, NATS and
# MinIO use fixed development credentials or none at all and must not be
# reachable from other machines. The gateway is the only service meant for
# clients; set GATEWAY_HOST_ADDR=0.0.0.0 to expose it on all interfaces, for
# example to test from another device on a trusted network.

# Shared settings of the Go services. Images are distroless and run as a
# non-root user; the services write nothing to disk, so the root filesystem
# is read-only and no Linux capabilities are needed.
x-go-service: &go-service
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat_db
    ports:
      - "127.0.0.1:${CHAT_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - chat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NATS remains an optional development tool; Redis carries chat events.
  nats:
    profiles: [events]
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_HOST_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: ..
      dockerfile: Dockerfile.minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "-http", "http://127.0.0.1:9000/minio/health/ready", "-timeout", "2s"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Application services. Configuration mirrors .env.example with service
  # names instead of localhost. Auth and Chat are reachable only inside the
  # Compose network; the Gateway is the single published entry point.
  #
  # gRPC targets use the passthrough:/// scheme: grpc-go's default dns:///
  # resolver also looks up a _grpc_config TXT record, which Docker's embedded
  # DNS forwards upstream, delaying every new connection by seconds and
  # failing the gateway's /ready deadline. Passthrough leaves name resolution
  # to the dialer.

  auth:
    <<: *go-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: auth
    environment:
      AUTH_GRPC_ADDR: ":50051"
      AUTH_DATABASE_URL: postgres://auth:auth@postgres:5432/auth_db?sslmode=disable
      AUTH_JWT_PRIVATE_KEY_PATH: /run/secrets/auth_jwt_private.pem
      AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/auth_jwt_public.pem
      AUTH_LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
    # Development keys from scripts/gen-jwt-keys.sh, mounted read-only and
    # never copied into the image. Long-syntax binds rather than Compose
    # secrets: with create_host_path disabled a Linux engine refuses to start
    # without the keys instead of creating empty directories in their place.
    # Docker Desktop still creates them (auth then logs "is a directory");
    # the key script removes such directories.
    volumes:
      - type: bind
        source: ../secrets/auth_jwt_private.pem
        target: /run/secrets/auth_jwt_private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../secrets/auth_jwt_public.pem
        target: /run/secrets/auth_jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "-grpc", "127.0.0.1:50051", "-timeout", "2s"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  chat:
    <<: *go-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: chat
    environment:
      CHAT_GRPC_ADDR: ":50052"
      CHAT_MEDIA_GRPC_ADDR: passthrough:///media:50053
      CHAT_AUTH_GRPC_ADDR: passthrough:///auth:50051
      CHAT_DATABASE_URL: postgres://chat:chat@chat-postgres:5432/chat_db?sslmode=disable
      # Real-time events go to the Redis the gateway subscribes to. Redis has
      # no password in development, as for the gateway.
      CHAT_REDIS_ADDR: redis:6379
      CHAT_EVENT_QUEUE_SIZE: "1024"
      CHAT_EVENT_PUBLISH_TIMEOUT: 1s
      # stop_grace_period below depends on this value.
      CHAT_EVENT_DRAIN_TIMEOUT: 5s
      CHAT_LOG_LEVEL: ${CHAT_LOG_LEVEL:-info}
    # Redis only orders the startup, so events of the first requests are not
    # lost. It is not part of Chat's healthcheck: when Redis fails later, Chat
    # keeps serving, drops the events it cannot publish and clients recover
    # them through catch-up.
    depends_on:
      chat-postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "-grpc", "127.0.0.1:50052", "-timeout", "2s"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Lets in-flight RPCs and queued events finish: Chat waits up to 5s for
    # RPCs, then publishes queued events for up to CHAT_EVENT_DRAIN_TIMEOUT
    # (5s). The rest is headroom for closing connections.
    stop_grace_period: 15s

  media-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
      POSTGRES_DB: media_db
    volumes:
      - media_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  media:
    <<: *go-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: media
    environment:
      MEDIA_GRPC_ADDR: ":50053"
      MEDIA_DATABASE_URL: postgres://media:media@media-postgres:5432/media_db?sslmode=disable
      MEDIA_AUTH_GRPC_ADDR: passthrough:///auth:50051
      MEDIA_CHAT_GRPC_ADDR: passthrough:///chat:50052
      MEDIA_S3_ENDPOINT: minio:9000
      MEDIA_S3_ACCESS_KEY: minioadmin
      MEDIA_S3_SECRET_KEY: minioadmin
      MEDIA_S3_BUCKET: vault-chat-media
      MEDIA_S3_SECURE: "false"
    depends_on:
      media-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "-grpc", "127.0.0.1:50053", "-timeout", "2s"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 10s

  gateway:
    <<: *go-service
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_AUTH_GRPC_ADDR: passthrough:///auth:50051
      GATEWAY_MEDIA_GRPC_ADDR: passthrough:///media:50053
      GATEWAY_CHAT_GRPC_ADDR: passthrough:///chat:50052
      GATEWAY_REDIS_ADDR: redis:6379
      # Plain HTTP for local use; TLS needs a certificate mounted like the
      # JWT keys and GATEWAY_TLS_CERT_PATH / GATEWAY_TLS_KEY_PATH set.
      # WebSocket upgrades (/api/v1/ws) also accept clients without an Origin
      # header and the gateway's own origin; other browser origins must be
      # listed here. The GATEWAY_WS_* limits keep their defaults.
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
    ports:
      - "${GATEWAY_HOST_ADDR:-127.0.0.1}:${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      media:
        condition: service_healthy
      auth:
        condition: service_healthy
      chat:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /health is liveness only; /ready (auth and chat reachable) is for
    # clients. Backend outages are reported by their own healthchecks.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "-http", "http://127.0.0.1:8080/health", "-timeout", "2s"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Lets in-flight requests finish and WebSocket connections close: the
    # gateway closes every connection with 1001 and drains REST requests
    # within one 15s shutdown timeout. The rest is headroom for closing
    # Redis and gRPC connections.
    stop_grace_period: 20s

volumes:
  pgdata:
  chat_pgdata:
  media_pgdata:
  redisdata:
  natsdata:
  miniodata:

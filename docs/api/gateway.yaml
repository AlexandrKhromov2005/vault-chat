openapi: 3.0.3
info:
  title: Vault Chat API Gateway
  version: 0.1.0
  description: |
    Public REST API of Vault Chat. The gateway authenticates requests through
    the auth service (gRPC) and forwards them to backend services.

    **Errors.** Every error has the body `{"error":{"code":"...","message":"..."}}`.

    **Correlation.** Send `X-Request-ID` (1-64 chars of `[A-Za-z0-9._-]`) to
    trace a request; otherwise one is generated. It is echoed in the response
    and forwarded to backends.

    **Rate limiting.** `/api/` routes are limited per client IP; authenticated
    routes are additionally limited per user. Responses carry
    `X-RateLimit-Limit` and `X-RateLimit-Remaining`; `429` responses carry
    `Retry-After` (seconds).

    **Time budget.** Each `/api/` request has one budget,
    `GATEWAY_REQUEST_TIMEOUT` (10s by default), covering rate limiting,
    reading the body, and backend calls. A body not received within it gets
    `408`; a request that runs out of it anywhere else gets `504`.
servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /health:
    get:
      summary: Liveness probe
      tags: [probes]
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}

  /ready:
    get:
      summary: Readiness probe
      description: Ready when both Auth and Chat answer their gRPC health checks.
      tags: [probes]
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: A dependency is unavailable.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}

  /api/v1/auth/register:
    post:
      summary: Register a new account
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, username, password]
              properties:
                email: {type: string, format: email, maxLength: 254, example: alice@example.com}
                username:
                  type: string
                  pattern: "^[A-Za-z][A-Za-z0-9_-]{2,31}$"
                  example: alice
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: At least one ASCII letter and one digit.
                  example: password1
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "409":
          description: Email or username already taken (`already_exists`).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/auth/login:
    post:
      summary: Log in with email and password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, example: alice@example.com}
                password: {type: string, example: password1}
      responses:
        "200":
          description: Credentials accepted; a token pair is issued.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/auth/me:
    get:
      summary: Identity of the caller
      tags: [auth]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/User"
                  - type: object
                    properties:
                      expires_at: {type: string, format: date-time, description: Access token expiry.}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      description: |
        The presented refresh token is rotated out and stops working. Presenting
        an already rotated token is treated as theft: every session of the user
        is revoked and the request fails with 401.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshTokenRequest"}
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenPair"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/auth/logout:
    post:
      summary: End the login of a refresh token
      description: |
        Revokes the session of the refresh token and the sessions it was rotated
        into. Idempotent: logging out an already ended session succeeds. No
        access token is required, since it may already have expired.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefreshTokenRequest"}
      responses:
        "204":
          description: The session is ended.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/auth/sessions:
    delete:
      summary: Log out everywhere
      description: |
        Revokes every session of the caller; their refresh tokens stop working.
        Access tokens already issued stay valid until they expire.
      tags: [auth]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked_count: {type: integer, format: int64, example: 2}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/users:
    get:
      summary: Search users by username prefix
      description: |
        Case-insensitive prefix match on username for choosing a conversation
        partner. Returns only user_id and username; the caller is never
        included. Results are ordered by lowercased username (byte order), so
        an exact match comes first. Duplicate or unknown query parameters are
        rejected. Any authenticated user can enumerate the directory by
        prefix; this is bounded only by the per-user rate limit and the page
        size.
      tags: [users]
      security: [{bearerAuth: []}]
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, minLength: 2, maxLength: 32, pattern: "^[A-Za-z][A-Za-z0-9_-]{1,31}$"}
          description: |
            Start of a username, 2 to 32 characters, not trimmed; '_' matches
            literally. Single-character queries are rejected.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        "200":
          description: Matching public profiles; empty when nothing matches.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: {$ref: "#/components/schemas/PublicProfile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/users/{user_id}:
    get:
      summary: Get an existing user's public profile by UUID
      description: Returns only user_id and username; requires an access token.
      tags: [users]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/UserID"}
      responses:
        "200":
          description: Existing public profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicProfile"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms:
    get:
      summary: List the caller's rooms, most recently active first
      description: |
        Activity is the later of the room's latest message and the caller's
        enrollment; ties are ordered by room_id descending. Rooms with new
        activity after the first page move to the top and are not repeated on
        later pages; fetch the first page again to see them. Duplicate or
        unknown query parameters are rejected.
      tags: [rooms]
      security: [{bearerAuth: []}]
      parameters:
        - name: cursor
          in: query
          schema: {type: string, pattern: "^$|^(0|[1-9][0-9]{0,17})_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
          description: Empty starts at the most recently active room. Otherwise use next_cursor unchanged.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Rooms and an exclusive next-page cursor; empty cursor means the end.
          content:
            application/json:
              schema:
                type: object
                required: [rooms, next_cursor]
                properties:
                  rooms:
                    type: array
                    items: {$ref: "#/components/schemas/RoomSummary"}
                  next_cursor: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms/direct:
    post:
      summary: Get or create a direct dialog with an existing user
      description: Idempotent for an unordered pair; a self-dialog is rejected.
      tags: [rooms]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [peer_user_id]
              properties:
                peer_user_id: {type: string, format: uuid}
      responses:
        "200":
          description: Existing or newly created direct dialog.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Room"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms/channels:
    post:
      summary: Create a channel owned by the authenticated caller
      description: Both public and private channels currently require invitation.
      tags: [rooms]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80, description: "Valid UTF-8, no control characters or surrounding whitespace."}
                private: {type: boolean, default: false}
      responses:
        "201":
          description: Channel and owner membership created atomically.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Room"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms/{room_id}:
    get:
      summary: Read room metadata as a member
      description: Absent rooms and nonmembers both receive the same 404 response.
      tags: [rooms]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/RoomID"}
      responses:
        "200":
          description: Room visible to the caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Room"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms/{room_id}/members:
    get:
      summary: List room members, ordered by user ID
      description: Members only; absent rooms and nonmembers both receive 404. Direct dialogs list both participants.
      tags: [rooms]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/RoomID"}
        - name: cursor
          in: query
          schema: {type: string, format: uuid}
          description: Empty starts at the lowest user ID. Otherwise use next_cursor unchanged (lowercase canonical UUID).
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Members and an exclusive next-page cursor; empty cursor means the end.
          content:
            application/json:
              schema:
                type: object
                required: [members, next_cursor]
                properties:
                  members:
                    type: array
                    items: {$ref: "#/components/schemas/Member"}
                  next_cursor: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms/{room_id}/members/{user_id}:
    put:
      summary: Add an existing user to a channel as its owner
      description: Idempotent; adding a third direct-dialog participant is forbidden.
      tags: [rooms]
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: "#/components/parameters/RoomID"}
        - {$ref: "#/components/parameters/UserID"}
      responses:
        "204": {description: User is a member of the channel.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

  /api/v1/rooms/{room_id}/messages:
    parameters:
      - {$ref: "#/components/parameters/RoomID"}
    post:
      summary: Send an immutable text message
      tags: [chat]
      security: [{bearerAuth: []}]
      description: |
        Membership is required. Retries with the same room, sender, UUID and
        exact text return the original message. Different text under that key
        returns 409. Sender identity always comes from the access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_message_id, text]
              properties:
                client_message_id: {type: string, format: uuid, description: Nonzero UUID retained across retries.}
                text:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Valid UTF-8 with non-whitespace content. Newline and tab are the only allowed controls.
      responses:
        "200":
          description: Message stored, or original result of an identical retry.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: The retry key was already used with different text.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "413": {$ref: "#/components/responses/TooLarge"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "408": {$ref: "#/components/responses/RequestTimeout"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}
    get:
      summary: Read member-only message history, newest first
      tags: [chat]
      security: [{bearerAuth: []}]
      description: Duplicate or unknown query parameters are rejected. An empty page still requires membership.
      parameters:
        - name: cursor
          in: query
          schema: {type: string, pattern: "^$|^[1-9][0-9]{0,18}$"}
          description: Empty starts at newest. Otherwise use next_cursor from this room, at most 9223372036854775807.
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Messages and an exclusive older-page cursor; empty cursor means the end.
          content:
            application/json:
              schema:
                type: object
                required: [messages, next_cursor]
                properties:
                  messages:
                    type: array
                    items: {$ref: "#/components/schemas/Message"}
                  next_cursor: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/RateLimited"}
        "503": {$ref: "#/components/responses/Unavailable"}
        "504": {$ref: "#/components/responses/Timeout"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /api/v1/auth/login. Refresh tokens are rejected.

  parameters:
    UserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    RoomID:
      name: room_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  schemas:
    Message:
      type: object
      required: [message_id, room_id, sender_id, client_message_id, text, created_at]
      properties:
        message_id: {type: string, format: uuid}
        room_id: {type: string, format: uuid}
        sender_id: {type: string, format: uuid}
        client_message_id: {type: string, format: uuid}
        text: {type: string, minLength: 1, maxLength: 4096}
        created_at: {type: string, format: date-time}
    Member:
      type: object
      required: [user_id, joined_at]
      properties:
        user_id: {type: string, format: uuid}
        joined_at: {type: string, format: date-time}
    PublicProfile:
      type: object
      required: [user_id, username]
      properties:
        user_id: {type: string, format: uuid}
        username: {type: string}
    Room:
      type: object
      required: [room_id, kind, private, created_at]
      properties:
        room_id: {type: string, format: uuid}
        kind: {type: string, enum: [direct, channel]}
        name: {type: string, description: Only present for channels.}
        owner_id: {type: string, format: uuid, description: Only present for channels.}
        private: {type: boolean}
        created_at: {type: string, format: date-time}
        participant_ids:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: string, format: uuid}
          description: Only present for direct dialogs. Both participants, including the caller, in UUID order.
    RoomSummary:
      allOf:
        - {$ref: "#/components/schemas/Room"}
        - type: object
          properties:
            last_message_at: {type: string, format: date-time, description: Time of the latest message; absent without messages.}
    User:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        username: {type: string}
    TokenPair:
      type: object
      properties:
        user_id: {type: string, format: uuid}
        token_type: {type: string, enum: [Bearer]}
        access_token: {type: string}
        refresh_token: {type: string}
        access_expires_at: {type: string, format: date-time}
        refresh_expires_at: {type: string, format: date-time}
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: {type: string}
    Readiness:
      type: object
      properties:
        status: {type: string, enum: [ready, not_ready]}
        checks:
          type: object
          additionalProperties: {type: string, enum: [ok, fail]}
          example: {auth: ok, chat: ok}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [invalid_argument, invalid_json, unauthenticated, permission_denied, not_found,
                     already_exists, body_too_large, unsupported_media_type, rate_limited,
                     cors_forbidden, request_timeout, timeout, unavailable, internal]
            message: {type: string}

  responses:
    NotFound:
      description: User or room absent, or the caller is not a room member.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Caller is not the channel owner, or the room is a direct dialog.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    BadRequest:
      description: Malformed JSON (`invalid_json`) or invalid field values (`invalid_argument`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Missing, malformed, invalid, or expired credentials.
      headers:
        WWW-Authenticate: {schema: {type: string}, description: Bearer challenge (RFC 6750).}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooLarge:
      description: Body exceeds GATEWAY_MAX_BODY_BYTES.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    UnsupportedMediaType:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RateLimited:
      description: Quota exhausted.
      headers:
        Retry-After: {schema: {type: integer}, description: Seconds until the next request is allowed.}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    RequestTimeout:
      description: The body was not received within the request budget (`request_timeout`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Timeout:
      description: The request budget ran out while rate limiting or waiting for a backend (`timeout`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unavailable:
      description: A backend service is unreachable.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault Chat</title>
  <link rel="stylesheet" href="/app/style.css">
  <script type="module" src="/app/app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <h1>Vault Chat</h1>
    <div id="account" class="account" hidden>
      <span id="account-name" class="account-name"></span>
      <button id="logout" type="button">Выйти</button>
    </div>
  </header>

  <main>
    <section id="auth" class="auth" hidden>
      <div class="tabs" role="tablist">
        <button id="show-login" type="button" role="tab" aria-selected="true">Вход</button>
        <button id="show-register" type="button" role="tab" aria-selected="false">Регистрация</button>
      </div>

      <form id="login-form" class="stack">
        <label>Email
          <input name="email" type="email" autocomplete="username" required>
        </label>
        <label>Пароль
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Войти</button>
      </form>

      <form id="register-form" class="stack" hidden>
        <label>Email
          <input name="email" type="email" autocomplete="email" maxlength="254" required>
        </label>
        <label>Имя пользователя
          <input name="username" autocomplete="username" minlength="3" maxlength="32"
                 pattern="[A-Za-z][A-Za-z0-9_\-]{2,31}" required>
        </label>
        <p class="hint">3–32 символа: латинские буквы, цифры, «_» и «-», первая — буква.</p>
        <label>Пароль
          <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </label>
        <p class="hint">Не короче 8 символов, хотя бы одна латинская буква и одна цифра.</p>
        <button type="submit">Зарегистрироваться</button>
      </form>

      <p id="auth-error" class="error" role="alert"></p>
    </section>

    <section id="workspace" class="workspace" hidden>
      <p class="placeholder">Вы вошли. Комнаты и переписка появятся в следующих изменениях.</p>
    </section>
  </main>
</body>
</html>

version: v2

managed:
  enabled: true

plugins:
  - local: protoc-gen-go
    out: ../../
    opt: module=github.com/AlexandrKhromov2005/vault-chat
  - local: protoc-gen-go-grpc
    out: ../../
    opt:
      - module=github.com/AlexandrKhromov2005/vault-chat
      - require_unimplemented_servers=true

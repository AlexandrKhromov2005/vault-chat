syntax = "proto3";

package chat.v1;

option go_package = "github.com/AlexandrKhromov2005/vault-chat/api/gen/go/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";

// ChatService manages rooms. Send a single "authorization: Bearer <access token>"
// gRPC metadata value. The server validates the token through Auth and derives
// the actor from it; caller identity is never accepted from request fields.
// Creating a dialog or adding a member also resolves the target through Auth.
service ChatService {
  // GetOrCreateDirect is idempotent for an unordered pair of distinct users.
  rpc GetOrCreateDirect(GetOrCreateDirectRequest) returns (GetOrCreateDirectResponse);
  // CreateChannel creates a channel and enrolls the caller as its sole owner.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  // GetRoom returns NOT_FOUND for both absent rooms and nonmembers.
  rpc GetRoom(GetRoomRequest) returns (GetRoomResponse);
  // ListRooms returns the caller's rooms, most recently active first. Activity is
  // the later of the latest message and the caller's enrollment in the room.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  // AddMember is owner-only, channel-only and idempotent for an existing member.
  // Public and private channels both require invitation in this first version.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  // ListMembers returns members ordered by user_id; NOT_FOUND for absent rooms
  // and nonmembers. Direct dialogs list both participants.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // RemoveMember is owner-only and channel-only; removing a nonmember succeeds.
  // The owner cannot be removed: FAILED_PRECONDITION.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // LeaveRoom removes the caller from a channel. The owner gets
  // FAILED_PRECONDITION until ownership can be transferred; direct dialogs
  // cannot be left (PERMISSION_DENIED). A former member gets NOT_FOUND.
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
  // SendMessage retries are idempotent per room, caller and client_message_id.
  // Reusing that key with different text returns ALREADY_EXISTS.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  // ListMessages returns newest first, or oldest first after a position when
  // after is set; membership is required even for empty pages.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
}

// RoomKind describes the supported room types.
enum RoomKind {
  ROOM_KIND_UNSPECIFIED = 0;
  ROOM_KIND_DIRECT = 1;
  ROOM_KIND_CHANNEL = 2;
}

// Room contains metadata visible to members. It does not expose a channel roster.
message Room {
  string id = 1;
  RoomKind kind = 2;
  // Empty for direct dialogs; channel names contain 1–80 Unicode code points.
  string name = 3;
  // Empty for direct dialogs. Channel owners are members as well.
  string owner_id = 4;
  bool private = 5;
  google.protobuf.Timestamp created_at = 6;
  // Both direct participants, including the caller, in UUID order; empty for channels.
  repeated string participant_ids = 7;
}

message GetOrCreateDirectRequest {
  string peer_user_id = 1;
}

message GetOrCreateDirectResponse {
  Room room = 1;
}

message CreateChannelRequest {
  string name = 1;
  bool private = 2;
}

message CreateChannelResponse {
  Room room = 1;
}

message GetRoomRequest {
  string room_id = 1;
}

message GetRoomResponse {
  Room room = 1;
}

message ListRoomsRequest {
  // Empty starts at the most recently active room; otherwise a next_cursor.
  string cursor = 1;
  // Zero defaults to 50; explicit limits must be 1–100.
  int32 limit = 2;
}

// RoomSummary is a room in the caller's list.
message RoomSummary {
  Room room = 1;
  // Unset when the room has no messages.
  google.protobuf.Timestamp last_message_at = 2;
}

message ListRoomsResponse {
  repeated RoomSummary rooms = 1;
  // Empty means the end of the list at the time this page was read.
  string next_cursor = 2;
}

message AddMemberRequest {
  string room_id = 1;
  string user_id = 2;
}

message AddMemberResponse {}

// Member is one membership visible to other members of the room.
message Member {
  string user_id = 1;
  google.protobuf.Timestamp joined_at = 2;
}

message ListMembersRequest {
  string room_id = 1;
  // Empty starts at the lowest user ID; otherwise a next_cursor.
  string cursor = 2;
  // Zero defaults to 50; explicit limits must be 1–100.
  int32 limit = 3;
}

message ListMembersResponse {
  repeated Member members = 1;
  // Empty means the end of the roster at the time this page was read.
  string next_cursor = 2;
}

message RemoveMemberRequest {
  string room_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message LeaveRoomRequest {
  string room_id = 1;
}

message LeaveRoomResponse {}

// Message is immutable; text may be empty only when attachments are present.
message Message {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string client_message_id = 4;
  string text = 5;
  google.protobuf.Timestamp created_at = 6;
  // Position in the room: committed messages have consecutive sequences
  // starting at 1, so a client can detect a gap and catch up after it.
  int64 sequence = 7;
  repeated string attachment_ids = 8;
}

message SendMessageRequest {
  string room_id = 1;
  // A nonzero UUID generated by the client and reused for retries.
  string client_message_id = 2;
  string text = 3;
  repeated string attachment_ids = 4;
}

message SendMessageResponse {
  Message message = 1;
}

message ListMessagesRequest {
  string room_id = 1;
  // Empty starts at newest; otherwise a canonical positive room sequence.
  string cursor = 2;
  // Zero defaults to 50; explicit limits must be 1–100.
  int32 limit = 3;
  // Catch-up: "0" or a canonical positive sequence. Returns messages after it,
  // oldest first. Cannot be combined with cursor.
  string after = 4;
}

message ListMessagesResponse {
  repeated Message messages = 1;
  // Empty means the end of the page direction at the time this page was read.
  // Pass it back in the same field, cursor or after, for the next page.
  string next_cursor = 2;
}
